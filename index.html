<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seamless Infinite Carousel</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
    }

    .carousel {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        position: relative;
        touch-action: pan-y;
    }

    .track {
        display: flex;
        height: 100%;
        will-change: transform;
    }

    .slide {
        min-width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 50px;
        font-weight: bold;
        color: white;
        user-select: none;
    }

    /* Placeholder backgrounds */
    .slide:nth-child(1) {
        background: #e74c3c;
    }

    .slide:nth-child(2) {
        background: #3498db;
    }

    .slide:nth-child(3) {
        background: #2ecc71;
    }

    .slide:nth-child(4) {
        background: #e74c3c;
    }

    .slide:nth-child(5) {
        background: #3498db;
    }

    .placeholder {
        width: 80%;
        height: 70%;
        border: 5px dashed rgba(255,255,255,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .hint {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        opacity: 0.7;
        font-size: 14px;
        pointer-events: none;
    }
</style>
</head>

<body>

<div class="carousel" id="carousel">

    <div class="track" id="track">

        <!-- Clone of Image 3 -->
        <div class="slide">
            <div class="placeholder">IMAGE 3</div>
        </div>

        <!-- Real slides -->
        <div class="slide">
            <div class="placeholder">IMAGE 1</div>
        </div>

        <div class="slide">
            <div class="placeholder">IMAGE 2</div>
        </div>

        <div class="slide">
            <div class="placeholder">IMAGE 3</div>
        </div>

        <!-- Clone of Image 1 -->
        <div class="slide">
            <div class="placeholder">IMAGE 1</div>
        </div>

    </div>

    <div class="hint">Swipe left or right</div>

</div>

<script>

const carousel = document.getElementById("carousel");
const track = document.getElementById("track");

let currentIndex = 1;

let startX = 0;
let currentX = 0;
let isDragging = false;

const totalSlides = 3;
const threshold = 50;


// Position carousel at Image 1
function setPosition(animate = true) {

    track.style.transition = animate
        ? "transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)"
        : "none";

    track.style.transform =
        `translateX(-${currentIndex * 100}%)`;
}

setPosition(false);


// Move to next/previous slide
function move(direction) {

    if (isDragging) return;

    currentIndex += direction;

    setPosition(true);
}


// When animation finishes, silently move from clones
track.addEventListener("transitionend", () => {

    // If we're on the clone of Image 3
    if (currentIndex === 0) {

        currentIndex = totalSlides;

        setPosition(false);
    }

    // If we're on the clone of Image 1
    if (currentIndex === totalSlides + 1) {

        currentIndex = 1;

        setPosition(false);
    }
});


// TOUCH START
carousel.addEventListener("touchstart", (event) => {

    startX = event.touches[0].clientX;
    currentX = startX;

    isDragging = true;

    track.style.transition = "none";
});


// TOUCH MOVE
carousel.addEventListener("touchmove", (event) => {

    if (!isDragging) return;

    currentX = event.touches[0].clientX;

    const difference = currentX - startX;

    const percentage =
        (difference / carousel.offsetWidth) * 100;

    track.style.transform =
        `translateX(calc(-${currentIndex * 100}% + ${percentage}%))`;
});


// TOUCH END
carousel.addEventListener("touchend", () => {

    if (!isDragging) return;

    isDragging = false;

    const difference = currentX - startX;

    // Swipe left
    if (difference < -threshold) {

        currentIndex++;
    }

    // Swipe right
    else if (difference > threshold) {

        currentIndex--;
    }

    setPosition(true);
});


// MOUSE SUPPORT FOR DESKTOP
carousel.addEventListener("mousedown", (event) => {

    startX = event.clientX;
    currentX = startX;

    isDragging = true;

    track.style.transition = "none";
});


carousel.addEventListener("mousemove", (event) => {

    if (!isDragging) return;

    currentX = event.clientX;

    const difference = currentX - startX;

    const percentage =
        (difference / carousel.offsetWidth) * 100;

    track.style.transform =
        `translateX(calc(-${currentIndex * 100}% + ${percentage}%))`;
});


carousel.addEventListener("mouseup", () => {

    if (!isDragging) return;

    isDragging = false;

    const difference = currentX - startX;

    if (difference < -threshold) {
        currentIndex++;
    }

    else if (difference > threshold) {
        currentIndex--;
    }

    setPosition(true);
});


carousel.addEventListener("mouseleave", () => {

    if (!isDragging) return;

    isDragging = false;

    setPosition(true);
});


// Keep the carousel correctly sized if the screen rotates
window.addEventListener("resize", () => {
    setPosition(false);
});

</script>

</body>
</html>
