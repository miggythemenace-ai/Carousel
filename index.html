<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seamless Infinite Carousel</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
    }

    .carousel {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        position: relative;
        touch-action: pan-y;
    }

    .track {
        display: flex;
        height: 100%;
        will-change: transform;
    }

    .slide {
        min-width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 50px;
        font-weight: bold;
        color: white;
        user-select: none;
    }

    /* Placeholder backgrounds */
    .slide:nth-child(1) {
        background: #e74c3c;
    }

    .slide:nth-child(2) {
        background: #3498db;
    }

    .slide:nth-child(3) {
        background: #2ecc71;
    }

    .slide:nth-child(4) {
        background: #e74c3c;
    }

    .slide:nth-child(5) {
        background: #3498db;
    }

    .placeholder {
        width: 80%;
        height: 70%;
        border: 5px dashed rgba(255,255,255,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .hint {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        opacity: 0.7;
        font-size: 14px;
        pointer-events: none;
    }
</style>
</head>

<body>

<div class="carousel" id="carousel">

    <div class="track" id="track">

        <!-- Clone of Image 3 -->
        <div class="slide">
            <div class="placeholder">IMAGE 3</div>
        </div>

        <!-- Real slides -->
        <div class="slide">
            <div class="placeholder">IMAGE 1</div>
        </div>

        <div class="slide">
            <div class="placeholder">IMAGE 2</div>
        </div>

        <div class="slide">
            <div class="placeholder">IMAGE 3</div>
        </div>

        <!-- Clone of Image 1 -->
        <div class="slide">
            <div class="placeholder">IMAGE 1</div>
        </div>

    </div>

    <div class="hint">Swipe left or right</div>

</div>

<script>

const carousel = document.getElementById("carousel");
const track = document.getElementById("track");
const totalSlides = 3;
const threshold = 50;
let currentIndex = 1;
let startX = 0;
let currentX = 0;
let isDragging = false;

function setPosition(animate = true, dragDistance = 0) {
    track.style.transition = animate
        ? "transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)"
        : "none";

    const offset = (currentIndex * -carousel.clientWidth) + dragDistance;
    track.style.transform = `translate3d(${offset}px, 0, 0)`;
}

function normalizeIndex() {
    currentIndex = ((currentIndex - 1 + totalSlides) % totalSlides) + 1;
}

function finishDrag() {
    if (!isDragging) return;

    isDragging = false;
    carousel.classList.remove("dragging");

    const difference = currentX - startX;
    if (difference < -threshold) currentIndex++;
    if (difference > threshold) currentIndex--;

    setPosition(true);
}

setPosition(false);

carousel.addEventListener("pointerdown", (event) => {
    isDragging = true;
    startX = event.clientX;
    currentX = startX;
    carousel.classList.add("dragging");
    carousel.setPointerCapture(event.pointerId);
    setPosition(false);
});

carousel.addEventListener("pointermove", (event) => {
    if (!isDragging) return;

    currentX = event.clientX;
    const dragDistance = currentX - startX;
    setPosition(false, dragDistance);
});

carousel.addEventListener("pointerup", finishDrag);
carousel.addEventListener("pointercancel", finishDrag);
carousel.addEventListener("dragstart", (event) => event.preventDefault());

track.addEventListener("transitionend", (event) => {
    if (event.propertyName !== "transform" || event.target !== track) return;

    if (currentIndex < 1 || currentIndex > totalSlides) {
        normalizeIndex();
    }

    setPosition(false);
});

window.addEventListener("resize", () => setPosition(false));

</script>

</body>
</html>
