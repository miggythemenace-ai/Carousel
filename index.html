<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seamless Infinite Carousel</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
    }

    .carousel {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        position: relative;
        touch-action: pan-y;
    }

    .track {
        display: flex;
        width: 100%;
        height: 100%;
        will-change: transform;
    }

    .slide {
        width: 100vw;
        min-width: 100vw;
        flex: 0 0 100vw;
        height: 100%;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        background: #000;
    }

    .slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        display: block;
        pointer-events: none;
    }

    .fallback-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.9);
        background: linear-gradient(135deg, #2f2f2f, #1a1a1a);
    }

    .hint {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        opacity: 0.7;
        font-size: 14px;
        pointer-events: none;
    }
</style>
</head>

<body>

<div class="carousel" id="carousel">

    <div class="track" id="track"></div>

    <div class="hint">Swipe left or right</div>

</div>

<script>

const carousel = document.getElementById("carousel");
const track = document.getElementById("track");
const imageFiles = [
    "images/Untitled_design_1.png",
    "images/Untitled_design_2.png",
    "images/Untitled_design_3.png"
];

const totalSlides = imageFiles.length;
const threshold = 50;
let currentIndex = 1;
let startX = 0;
let currentX = 0;
let isDragging = false;

function createSlide(src, label) {
    const slide = document.createElement("div");
    slide.className = "slide";

    const img = document.createElement("img");
    img.src = src;
    img.alt = label;

    img.addEventListener("error", () => {
        if (slide.querySelector(".fallback-label")) return;
        const fallback = document.createElement("div");
        fallback.className = "fallback-label";
        fallback.textContent = `${label} (missing file)`;
        slide.appendChild(fallback);
    });

    img.addEventListener("load", () => {
        const fallback = slide.querySelector(".fallback-label");
        if (fallback) fallback.remove();
    });

    slide.appendChild(img);
    return slide;
}

function buildSlides() {
    track.innerHTML = "";

    const orderedSlides = [
        imageFiles[imageFiles.length - 1],
        ...imageFiles,
        imageFiles[0]
    ];

    orderedSlides.forEach((src, index) => {
        const label = `Image ${((index - 1 + totalSlides) % totalSlides) + 1}`;
        track.appendChild(createSlide(src, label));
    });
}

function setPosition(animate = true, dragDistance = 0) {
    track.style.transition = animate
        ? "transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)"
        : "none";

    const offset = (currentIndex * -carousel.clientWidth) + dragDistance;
    track.style.transform = `translate3d(${offset}px, 0, 0)`;
}

function normalizeIndex() {
    currentIndex = ((currentIndex - 1 + totalSlides) % totalSlides) + 1;
}

function finishDrag() {
    if (!isDragging) return;

    isDragging = false;
    carousel.classList.remove("dragging");

    const difference = currentX - startX;
    if (difference < -threshold) currentIndex++;
    if (difference > threshold) currentIndex--;

    setPosition(true);
}

buildSlides();
setPosition(false);

carousel.addEventListener("pointerdown", (event) => {
    if (currentIndex < 1 || currentIndex > totalSlides) {
        normalizeIndex();
        setPosition(false);
    }

    isDragging = true;
    startX = event.clientX;
    currentX = startX;
    carousel.classList.add("dragging");
    carousel.setPointerCapture(event.pointerId);
    setPosition(false);
});

carousel.addEventListener("pointermove", (event) => {
    if (!isDragging) return;

    currentX = event.clientX;
    const dragDistance = currentX - startX;
    setPosition(false, dragDistance);
});

carousel.addEventListener("pointerup", finishDrag);
carousel.addEventListener("pointercancel", finishDrag);
carousel.addEventListener("dragstart", (event) => event.preventDefault());

track.addEventListener("transitionend", (event) => {
    if (event.propertyName !== "transform" || event.target !== track) return;

    if (currentIndex < 1 || currentIndex > totalSlides) {
        normalizeIndex();
    }

    setPosition(false);
});

window.addEventListener("resize", () => setPosition(false));

</script>

</body>
</html>
