<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Your Character</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Home">M//</a>
        <p class="mode-label">VERSUS MODE <span></span> CHARACTER SELECT</p>
        <p class="player-label">P1 <strong>READY</strong></p>
      </header>

      <section class="selection-screen" aria-labelledby="screen-title">
        <div class="intro">
          <p class="eyebrow">ROSTER / 04</p>
          <h1 id="screen-title">Choose your<br /><em>fighter.</em></h1>
          <p class="instructions">Drag to browse the roster</p>
        </div>

        <div class="carousel-wrap">
          <div class="carousel" data-carousel aria-label="Character roster">
            <div class="carousel-track">
              <article class="character character--ember" data-name="Ember" data-role="The Spark">
                <div class="portrait"><img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=900&q=85" alt="Ember character portrait" draggable="false" /></div>
                <div class="card-meta"><span>01</span><h2>Ember</h2><p>The Spark</p></div>
              </article>
              <article class="character character--nova" data-name="Nova" data-role="Gravity Runner">
                <div class="portrait"><img src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?auto=format&fit=crop&w=900&q=85" alt="Nova character portrait" draggable="false" /></div>
                <div class="card-meta"><span>02</span><h2>Nova</h2><p>Gravity Runner</p></div>
              </article>
              <article class="character character--juno" data-name="Juno" data-role="Void Walker">
                <div class="portrait"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=85" alt="Juno character portrait" draggable="false" /></div>
                <div class="card-meta"><span>03</span><h2>Juno</h2><p>Void Walker</p></div>
              </article>
              <article class="character character--atlas" data-name="Atlas" data-role="Iron Heart">
                <div class="portrait"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=85" alt="Atlas character portrait" draggable="false" /></div>
                <div class="card-meta"><span>04</span><h2>Atlas</h2><p>Iron Heart</p></div>
              </article>
            </div>
          </div>
          <div class="carousel-hint" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        </div>
      </section>

      <footer class="footer"><span>SELECT A CHARACTER</span><span class="footer-line"></span><span>ENTER TO CONFIRM</span></footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
